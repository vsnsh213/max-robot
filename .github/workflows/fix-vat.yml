name: Korekta VAT w zamowieniach BaseLinker
on:
  schedule:
    - cron: "5-59/10 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "1 = zapis, 0 = tylko raport (dry-run)"
        required: false
        default: "1"
permissions:
  contents: read
# jeden przebieg naraz (cron-job.org + harmonogram GitHub moga wystartowac prawie razem)
concurrency:
  group: fix-vat
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fix VAT
        env:
          BLT: ${{ secrets.BASELINKER_TOKEN }}
          APPLY: ${{ github.event.inputs.apply || '1' }}
        run: python3 fix_vat.py
