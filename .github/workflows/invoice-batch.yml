name: Hurtowo do faktury (Do zafakturowania)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "ID zamowien przez przecinek"
        required: true
      apply:
        description: "1 = zapis, 0 = tylko raport"
        default: "0"
permissions:
  contents: read
# jeden przebieg naraz (cron-job.org + harmonogram GitHub moga wystartowac prawie razem)
concurrency:
  group: invoice-batch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Batch
        env:
          BLT: ${{ secrets.BASELINKER_TOKEN }}
          IDS: ${{ inputs.ids }}
          APPLY: ${{ inputs.apply }}
        run: python3 batch_invoice.py
