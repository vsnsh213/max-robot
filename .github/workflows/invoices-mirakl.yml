name: Faktury do Empik i Media Expert
on:
  schedule:
    # raz dziennie 09:20 czasu warszawskiego zimą (CET = UTC+1). Latem (CEST) bedzie 10:20.
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "1 = wysylka, 0 = tylko raport (dry-run)"
        default: "0"
      only_orders:
        description: "Tylko te ID zamowien z Base przez przecinek (puste = wszystkie)"
        default: ""
      max_uploads:
        description: "Maks. ile faktur wyslac w jednym uruchomieniu"
        default: "1"
      markets:
        description: "empik,mediaexpert"
        default: "empik,mediaexpert"
      skip_orders:
        description: "Nie wysylac do tych ID z Base (puste = domyslna lista wstrzymanych)"
        default: ""
permissions:
  contents: read
# jeden przebieg naraz (cron-job.org + harmonogram GitHub moga wystartowac prawie razem)
concurrency:
  group: invoices-mirakl
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Faktury Mirakl
        env:
          BLT: ${{ secrets.BASELINKER_TOKEN }}
          EMPIK_API_KEY: ${{ secrets.EMPIK_API_KEY }}
          MEDIAEXPERT_API_KEY: ${{ secrets.MEDIAEXPERT_API_KEY }}
          # przy uruchomieniu z harmonogramu inputs sa puste -> wartosci domyslne po ||
          APPLY: ${{ inputs.apply || '1' }}
          ONLY_ORDERS: ${{ inputs.only_orders || '' }}
          MAX_UPLOADS: ${{ inputs.max_uploads || '5' }}
          MARKETS: ${{ inputs.markets || 'empik,mediaexpert' }}
          # wstrzymane do odpowiedzi Lechy: 82930642 (FS/192), 78403761 (332/10/2026 - nie FS), 79373568 (brak faktury)
          SKIP_ORDERS: ${{ inputs.skip_orders || '82930642,78403761,79373568' }}
        run: python3 invoices_mirakl.py
